<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Science Pro — Reyting</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f3f5);
    --text: var(--tg-theme-text-color, #15171a);
    --hint: var(--tg-theme-hint-color, #8a8f98);
    --accent: var(--tg-theme-button-color, #2b7de9);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --line: color-mix(in srgb, var(--hint) 22%, transparent);
    --good:#2fa66a; --mid:#e0a12b; --bad:#e2554f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg2);color:var(--text);
    font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:640px;margin:0 auto;padding:14px 14px 40px}
  header{display:flex;align-items:center;gap:12px;padding:6px 2px 14px}
  .logo{width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--accent-text);
    display:grid;place-items:center;font-weight:800;font-size:17px;letter-spacing:-.5px;flex:none}
  h1{font-size:19px;margin:0;line-height:1.2}
  .sub{color:var(--hint);font-size:13px}
  .tabs{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px;position:sticky;top:6px;z-index:2;
    box-shadow:0 1px 0 var(--line)}
  .tabs button{flex:1;border:0;background:none;color:var(--text);font:inherit;font-size:14px;font-weight:600;
    padding:9px 4px;border-radius:9px;cursor:pointer}
  .tabs button.on{background:var(--accent);color:var(--accent-text)}
  .card{background:var(--bg);border-radius:14px;padding:14px;margin-top:12px}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--hint);margin:0 0 8px;font-weight:700}
  .row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
  .row:first-of-type{border-top:0}
  .rank{width:28px;text-align:center;font-weight:700;color:var(--hint);flex:none;font-variant-numeric:tabular-nums}
  .rank.m{font-size:19px}
  .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta{color:var(--hint);font-size:12px}
  .score{font-weight:700;font-variant-numeric:tabular-nums;flex:none}
  .me{background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:10px;padding-left:6px;padding-right:6px}
  .test{cursor:pointer}
  .test .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .test h3{margin:0;font-size:16px}
  .chev{color:var(--hint);transition:transform .2s;flex:none}
  .test.open .chev{transform:rotate(90deg)}
  .bars{margin-top:10px;display:grid;gap:7px}
  .bar{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:4px 8px;align-items:center;font-size:13px}
  .bar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar .pct{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .track{grid-column:1/-1;height:7px;border-radius:4px;background:var(--bg2);overflow:hidden}
  .fill{height:100%;border-radius:4px}
  .results{display:none;margin-top:10px}
  .test.open .results{display:block}
  .empty{color:var(--hint);text-align:center;padding:26px 10px}
  .big{display:flex;gap:10px;margin-top:4px}
  .stat{flex:1;background:var(--bg2);border-radius:12px;padding:10px;text-align:center}
  .stat b{display:block;font-size:22px}
  .stat span{font-size:12px;color:var(--hint)}
  .tip{margin-top:10px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--bad) 12%,transparent);font-size:14px}
  .search{width:100%;border:1px solid var(--line);background:var(--bg2);color:var(--text);border-radius:10px;
    padding:9px 12px;font:inherit;margin-bottom:6px}
  .more{border:0;background:none;color:var(--accent);font:inherit;font-weight:600;padding:8px 0 0;cursor:pointer}
  footer{color:var(--hint);font-size:12px;text-align:center;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">SP</div>
    <div>
      <h1>Science Pro</h1>
      <div class="sub">Dream School · Ibn Sinoga tayyorlov</div>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="mock" class="on">Mock exam</button>
    <button data-tab="mavzu">Mavzulashgan</button>
    <button data-tab="me">Mening natijam</button>
  </nav>

  <main id="view"><div class="empty">Yuklanmoqda…</div></main>
  <footer id="foot"></footer>
</div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const user = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;

const $view = document.getElementById("view");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const color = p => p >= 75 ? "var(--good)" : p >= 50 ? "var(--mid)" : "var(--bad)";
const medal = i => ["🥇","🥈","🥉"][i] || "";
const KIND = {mock: "Mock exam", mavzu: "Mavzulashgan test"};

let DATA = null, myHash = null, myName = null, tab = "mock";

async function sha16(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("").slice(0, 16);
}

function bars(topics) {
  return `<div class="bars">${topics.map(([t, p]) => `
    <div class="bar"><span class="lbl">${esc(t)}</span><span class="pct" style="color:${color(p)}">${p}%</span>
      <div class="track"><div class="fill" style="width:${p}%;background:${color(p)}"></div></div></div>`).join("")}</div>`;
}

// O'rinlar: teng ballga teng o'rin
function places(list, scoreIdx) {
  let prev = null, place = 0;
  return list.map((r, i) => { if (r[scoreIdx] !== prev) { place = i + 1; prev = r[scoreIdx]; } return place; });
}

function rankRows(list, scoreIdx, fmt, limit) {
  const pl = places(list, scoreIdx);
  return list.slice(0, limit).map((r, i) => {
    const p = pl[i], mine = myName && r[0] === myName;
    return `<div class="row${mine ? " me" : ""}">
      <span class="rank${p <= 3 ? " m" : ""}">${p <= 3 ? medal(p - 1) : p}</span>
      <span class="name">${esc(r[0])}</span>${fmt(r)}</div>`;
  }).join("");
}

function renderKind(kind) {
  const k = DATA.kinds[kind] || {rating: [], tests: []};
  if (!k.tests.length) {
    $view.innerHTML = `<div class="card"><div class="empty">${KIND[kind]} bo'yicha hali yakunlangan test yo'q.</div></div>`;
    return;
  }
  const LIM = 50;
  let html = `<div class="card"><h2>Umumiy reyting · ${k.tests.length} ta test</h2>
    ${k.rating.length > 8 ? `<input class="search" id="q" placeholder="Ism bo'yicha qidirish">` : ""}
    <div id="rlist">${rankRows(k.rating, 1, r => `<span class="meta">${r[2]} ta</span><span class="score">${r[1]}%</span>`, LIM)}</div>
    ${k.rating.length > LIM ? `<button class="more" id="all">Hammasini ko'rsatish (${k.rating.length})</button>` : ""}
  </div>`;
  html += k.tests.map((t, i) => `
    <div class="card test" data-i="${i}">
      <div class="top"><h3>${esc(t.title)}</h3><span class="chev">›</span></div>
      <div class="meta">${esc(t.date)} · ${t.results.length} nafar · ${t.n} ta savol</div>
      ${bars([...t.topics].sort((a, b) => a[1] - b[1]))}
      <div class="results">${rankRows(t.results, 1, r => `<span class="score">${r[1]}/${t.n}</span>`, 1000)}</div>
    </div>`).join("");
  $view.innerHTML = html;

  $view.querySelectorAll(".test").forEach(el => el.onclick = () => {
    el.classList.toggle("open");
    tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged();
  });
  const fmt = r => `<span class="meta">${r[2]} ta</span><span class="score">${r[1]}%</span>`;
  const all = document.getElementById("all");
  if (all) all.onclick = () => { document.getElementById("rlist").innerHTML = rankRows(k.rating, 1, fmt, 1e6); all.remove(); };
  const q = document.getElementById("q");
  if (q) q.oninput = () => {
    const s = q.value.trim().toLowerCase();
    const pl = places(k.rating, 1);
    document.getElementById("rlist").innerHTML = !s ? rankRows(k.rating, 1, fmt, LIM) :
      k.rating.map((r, i) => [r, pl[i]]).filter(([r]) => r[0].toLowerCase().includes(s)).map(([r, p]) =>
        `<div class="row"><span class="rank">${p}</span><span class="name">${esc(r[0])}</span>${fmt(r)}</div>`).join("")
      || `<div class="empty">Topilmadi</div>`;
  };
}

function renderMe() {
  const st = myHash && DATA.students[myHash];
  if (!user) {
    $view.innerHTML = `<div class="card"><div class="empty">Shaxsiy natijalarni ko'rish uchun ilovani Telegram'dagi bot orqali oching.</div></div>`;
    return;
  }
  if (!st) {
    $view.innerHTML = `<div class="card"><div class="empty">Hali yakunlangan testlaringiz yo'q.<br>Javob yuborgan testingiz yakunlangach, natijangiz shu yerda chiqadi.</div></div>`;
    return;
  }
  const pcts = st.tests.map(t => Math.round(100 * t[2] / t[3]));
  const avg = Math.round(pcts.reduce((a, b) => a + b, 0) / pcts.length);
  const best = Math.max(...pcts);
  const weak = st.topics.filter(t => t[1] < 60).map(t => t[0]);
  $view.innerHTML = `
    <div class="card"><h2>${esc(st.name)}</h2>
      <div class="big">
        <div class="stat"><b>${st.tests.length}</b><span>ta test</span></div>
        <div class="stat"><b style="color:${color(avg)}">${avg}%</b><span>o'rtacha</span></div>
        <div class="stat"><b style="color:${color(best)}">${best}%</b><span>eng yaxshi</span></div>
      </div>
      ${weak.length ? `<div class="tip">📌 Ko'proq e'tibor bering: <b>${weak.map(esc).join(", ")}</b></div>` : ""}
    </div>
    <div class="card"><h2>Mavzular bo'yicha</h2>${bars(st.topics)}</div>
    <div class="card"><h2>Testlar tarixi</h2>
      ${[...st.tests].reverse().map(t => {
        const p = Math.round(100 * t[2] / t[3]);
        return `<div class="row"><span class="name">${esc(t[0])}<div class="meta">${KIND[t[1]] || ""} · ${esc(t[4])}</div></span>
          <span class="score" style="color:${color(p)}">${t[2]}/${t[3]}</span></div>`;
      }).join("")}
    </div>`;
}

function render() {
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  tab === "me" ? renderMe() : renderKind(tab);
}

document.getElementById("tabs").onclick = e => {
  const b = e.target.closest("button");
  if (!b) return;
  tab = b.dataset.tab;
  tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged();
  render();
  window.scrollTo({top: 0});
};

(async () => {
  try {
    const r = await fetch("data.json?t=" + Date.now(), {cache: "no-store"});
    DATA = await r.json();
  } catch (e) {
    $view.innerHTML = `<div class="card"><div class="empty">Ma'lumotlarni yuklab bo'lmadi. Keyinroq qayta oching.</div></div>`;
    return;
  }
  if (user && crypto.subtle) {
    myHash = await sha16("sciencepro:" + user.id);
    myName = DATA.students[myHash] && DATA.students[myHash].name;
  }
  document.getElementById("foot").textContent = "Yangilangan: " + DATA.updated;
  render();
})();
</script>
</body>
</html>
