<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Science Pro</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Science Pro: laboratoriya daftari — millimetrovka fon, zumrad + qahrabo */
  :root{
    --page:#EDF3F0; --bg:#FFFFFF; --bg2:#EDF3F0; --text:#102A2B; --hint:#5F7B78;
    --accent:#0E6E61; --accent-text:#FFFFFF; --amber:#F0A23B;
    --hero:#0F3D3E; --hero2:#155552; --on-hero:#F2FBF8;
    --grid:rgba(14,110,97,.075);
    --line:rgba(16,42,43,.10); --soft:rgba(14,110,97,.10);
    --good:#1F9D6B; --mid:#D9901F; --bad:#D9544C;
    --c-mock:#E08A1E; --c-sinf5:#1F9D6B; --c-sinf6:#2D7FC1; --c-mavzu:#8A6AD0;
    --display:"Unbounded",system-ui,sans-serif;
    --shadow:0 1px 0 rgba(16,42,43,.06),0 6px 18px -10px rgba(16,42,43,.25);
  }
  :root[data-theme="dark"]{
    --page:#0B1718; --bg:#132627; --bg2:#0F1E1F; --text:#E4EFEC; --hint:#86A19D;
    --accent:#3DBBA2; --accent-text:#05201B; --hero:#0E3536; --hero2:#124846;
    --grid:rgba(61,187,162,.06); --line:rgba(228,239,236,.09); --soft:rgba(61,187,162,.14);
    --shadow:0 1px 0 rgba(0,0,0,.25);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background-color:var(--page);color:var(--text);
    font:15px/1.5 "Golos Text",-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  html{min-height:100%;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:22px 22px;background-attachment:fixed}
  body{background:transparent;min-height:100vh}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  button{font:inherit;color:inherit}
  :root{--safe-top:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px))}
  .wrap{max-width:720px;margin:0 auto;padding:calc(14px + var(--safe-top)) 14px 96px}
  .fs{margin-left:auto;border:0;background:var(--bg);border-radius:12px;width:40px;height:40px;font-size:18px;cursor:pointer;flex:none}
  .card{background:var(--bg);border-radius:18px;padding:16px;margin-top:12px;box-shadow:var(--shadow)}
  h2.sec{font-size:14px;color:var(--hint);margin:0 0 10px;font-weight:600}
  .meta{color:var(--hint);font-size:13px}
  .empty{color:var(--hint);text-align:center;padding:28px 12px}

  /* bosh sahifa: zumrad "laboratoriya" bloki */
  .hero{position:relative;overflow:hidden;color:var(--on-hero);
    background:radial-gradient(120% 90% at 85% 0%,var(--hero2),var(--hero) 60%);
    margin:calc(-14px - var(--safe-top)) -14px 0;padding:calc(16px + var(--safe-top)) 18px 22px;border-radius:0 0 30px 30px}
  .hero .art{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .hero > *:not(.art){position:relative}
  .top{display:flex;align-items:center;gap:12px}
  .logo{width:44px;height:44px;border-radius:14px;background:var(--amber);color:#2A1700;
    display:grid;place-items:center;font:700 15px/1 var(--display);flex:none;letter-spacing:-.5px}
  .top b{display:block;font:700 16px/1.2 var(--display);letter-spacing:-.2px}
  .top .meta{color:rgba(242,251,248,.68)}
  .hero .fs{background:rgba(255,255,255,.12);color:var(--on-hero)}
  .hello{color:var(--amber);font-weight:600;font-size:15px;margin:26px 0 4px}
  .h1{font:700 26px/1.18 var(--display);letter-spacing:-.6px;margin:0;max-width:15ch}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:22px;border-radius:16px;overflow:hidden;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
  .stats div{padding:12px 6px;text-align:center}
  .stats div+div{border-left:1px solid rgba(255,255,255,.12)}
  .stats b{display:block;font:700 19px/1.3 var(--display)}
  .stats span{font-size:12px;color:rgba(242,251,248,.7)}
  .catalog-h{font:700 17px/1.3 var(--display);margin:22px 4px 2px;letter-spacing:-.3px}
  .cat{display:flex;align-items:center;gap:14px;background:var(--bg);border-radius:20px;padding:14px 14px 14px 12px;margin-top:10px;
    cursor:pointer;width:100%;text-align:left;border:0;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .cat::after{content:"";position:absolute;right:-18px;bottom:-18px;width:86px;height:86px;border-radius:50%;
    background:color-mix(in srgb,var(--c) 9%,transparent)}
  .cat:active{transform:scale(.985)}
  .badge{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font:700 17px/1 var(--display);flex:none;
    background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
  .badge svg{width:28px;height:28px}
  .cat .t{font:700 16px/1.25 var(--display);letter-spacing:-.2px}
  .cat .chev{position:relative;z-index:1}
  .stats .light{color:var(--on-hero)}
  .chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;margin-top:6px;
    background:color-mix(in srgb,var(--c, var(--accent)) 14%,transparent);color:var(--c, var(--accent))}
  .chev{margin-left:auto;color:var(--hint);font-size:22px;flex:none}

  /* bo'lim */
  .titlebar{display:flex;align-items:center;gap:10px;margin:4px 2px 0}
  .titlebar .badge{width:40px;height:40px;font-size:14px;border-radius:12px}
  .titlebar h1{font:700 21px/1.2 var(--display);margin:0;letter-spacing:-.4px}
  .intro h1,.tst h3{font-family:var(--display);letter-spacing:-.3px}
  .tst{cursor:pointer}
  .tst h3{margin:0 0 4px;font-size:16px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chips span{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--bg2);color:var(--text)}
  .done-tag{color:var(--good);font-weight:700;font-size:13px}
  .row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
  .row:first-of-type{border-top:0}
  .rank{width:28px;text-align:center;font-weight:700;color:var(--hint);flex:none;font-variant-numeric:tabular-nums}
  .rank.m{font-size:19px}
  .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .score{font-weight:700;font-variant-numeric:tabular-nums;flex:none}
  .me{background:var(--soft);border-radius:10px;padding-left:6px;padding-right:6px}
  .bars{display:grid;gap:8px;margin-top:10px}
  .bar{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:4px 8px;align-items:center;font-size:13px}
  .bar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar .pct{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .track{grid-column:1/-1;height:7px;border-radius:4px;background:var(--bg2);overflow:hidden}
  .fill{height:100%;border-radius:4px}
  .fold .results{display:none;margin-top:10px}
  .fold.open .results{display:block}
  .seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px;margin-top:12px}
  .seg button{flex:1;border:0;background:none;font-size:14px;font-weight:600;padding:9px 4px;border-radius:9px;cursor:pointer}
  .seg button.on{background:var(--accent);color:var(--accent-text)}
  .tip{margin-top:10px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--bad) 12%,transparent);font-size:14px}

  /* pastki menyu */
  .nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);
    display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
  .nav button{flex:1;border:0;background:none;padding:6px 0;font-size:11px;font-weight:600;color:var(--hint);cursor:pointer}
  .nav button i{display:block;height:24px;margin-bottom:2px}
  .nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .nav button.on i{color:var(--accent)}
  .nav button.on{color:var(--accent)}

  /* test oldi */
  .intro h1{font-size:22px;margin:6px 0 4px;line-height:1.25}
  .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
  .facts div{background:var(--bg2);border-radius:12px;padding:12px 6px;text-align:center}
  .facts b{display:block;font-size:19px}
  .facts span{font-size:12px;color:var(--hint)}
  .rules{margin:14px 0 0;padding-left:20px;color:var(--text);font-size:14px}
  .rules li{margin:4px 0}
  .btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;
    background:var(--accent);color:var(--accent-text);cursor:pointer;margin-top:16px}
  .btn.ghost{background:var(--bg2);color:var(--text)}

  /* imtihon */
  .exam{padding-bottom:110px}
  .ehead{position:sticky;top:0;z-index:4;background:var(--bg);margin:calc(-14px - var(--safe-top)) -14px 0;padding:calc(10px + var(--safe-top)) 14px 0;
    border-bottom:1px solid var(--line)}
  .ehead .l1{display:flex;align-items:center;gap:10px}
  .ehead .ttl{flex:1;min-width:0;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:16px;padding:5px 11px;border-radius:999px;
    background:var(--soft);color:var(--accent);flex:none}
  .timer.warn{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}
  .prog{height:4px;background:var(--bg2);margin:10px -14px 0}
  .prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
  .qnum{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 8px}
  .qnum b{font-size:15px}
  .flag{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
  .flag.on{background:color-mix(in srgb,var(--mid) 18%,transparent);border-color:var(--mid);color:var(--mid);font-weight:700}
  .topic{font-size:12px;color:var(--hint);margin:0 2px 6px}
  .qcard{background:var(--bg);border-radius:16px;padding:16px}
  .qtext{font-size:17px;line-height:1.5}
  .qtext + .qtext{margin-top:6px}
  .qimg{display:block;width:100%;height:auto;border-radius:12px;margin-top:12px;background:var(--bg2);cursor:zoom-in;
    min-height:120px;object-fit:contain}
  .zoomhint{font-size:12px;color:var(--hint);text-align:center;margin-top:4px}
  .tbl{overflow-x:auto;margin-top:12px}
  .tbl table{border-collapse:collapse;width:100%;font-size:14px}
  .tbl td{border:1px solid var(--line);padding:7px 9px;text-align:center}
  .tbl tr:first-child td{background:var(--bg2);font-weight:700}
  .opts{display:grid;gap:10px;margin-top:12px}
  .opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:var(--bg);border:2px solid transparent;
    border-radius:14px;padding:13px 14px;cursor:pointer;font-size:16px;line-height:1.4}
  .opt .L{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;
    font-weight:800;font-size:14px;flex:none;margin-top:-2px}
  .opt.sel{border-color:var(--accent);background:var(--soft)}
  .opt.sel .L{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
  .opt img{max-width:100%;border-radius:8px;margin-top:6px;display:block}
  .ebar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);z-index:5;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
  .ebar .in{max-width:720px;margin:0 auto;display:flex;gap:8px}
  .ebar button{border:0;border-radius:12px;padding:13px 10px;font-weight:700;font-size:15px;cursor:pointer;background:var(--bg2)}
  .ebar .grid-btn{flex:none;min-width:84px}
  .ebar .nx{flex:1;background:var(--accent);color:var(--accent-text)}
  .ebar .pv{flex:1}
  .ebar button:disabled{opacity:.4}
  .ebar .fin{background:var(--good);color:#fff}

  /* savollar katagi */
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
  .sheet .box{background:var(--bg);width:100%;max-width:720px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));
    max-height:80vh;overflow:auto}
  .sheet h3{margin:0 0 4px}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--hint);margin:6px 0 12px}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:4px}
  .cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
  .cells button{aspect-ratio:1;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:700;cursor:pointer;position:relative}
  .cells .a{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
  .cells .f::after{content:"";position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--mid)}
  .cells .cur{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:1px}

  /* rasm ko'ruvchi */
  .viewer{position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column}
  .viewer .vbar{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;color:#fff;font-size:14px}
  .viewer .vbar button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:999px;padding:7px 14px;font-weight:700;cursor:pointer}
  .viewer .stage{flex:1;overflow:auto;touch-action:pan-x pan-y;display:flex}
  .viewer img{margin:auto;max-width:none;display:block;user-select:none;-webkit-user-drag:none}
  .toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;
    border-radius:12px;font-weight:600;z-index:30;font-size:14px;max-width:90%;text-align:center}
  footer{color:var(--hint);font-size:12px;text-align:center;margin-top:18px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Yuklanmoqda…</div></div>
<nav class="nav" id="nav">
  <button data-go="home" class="on"><i><svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6.2L4.6 18.4A1.8 1.8 0 0 0 6.2 21h11.6a1.8 1.8 0 0 0 1.6-2.6L14 9.2V3"/><path d="M7.3 15h9.4"/></svg></i>Testlar</button>
  <button data-go="rating"><i><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0Z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></svg></i>Reyting</button>
  <button data-go="me"><i><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></i>Natijam</button>
</nav>

<script>
const tg = window.Telegram && Telegram.WebApp;
const canFS = () => !!(tg && tg.isVersionAtLeast && tg.isVersionAtLeast("8.0") && tg.requestFullscreen);
function applyTheme() {
  const dark = tg && tg.colorScheme ? tg.colorScheme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "dark" : "light";
}
function paintChrome() {   // Telegram sarlavha rangi sahifaga mos bo'lsin
  if (!tg || !tg.isVersionAtLeast || !tg.isVersionAtLeast("6.9")) return;
  const cs = getComputedStyle(document.documentElement);
  try {
    tg.setHeaderColor((route.v === "home" ? cs.getPropertyValue("--hero") : cs.getPropertyValue("--page")).trim());
    tg.setBackgroundColor(cs.getPropertyValue("--page").trim());
  } catch (e) {}
}
applyTheme();
if (tg) {
  tg.ready(); tg.expand();
  tg.onEvent("themeChanged", () => { applyTheme(); render(); });
  try { if (tg.isVersionAtLeast("7.7")) tg.disableVerticalSwipes(); } catch (e) {}   // tasodifan yopilib ketmasin
  if (canFS()) {
    try { tg.requestFullscreen(); } catch (e) {}                                    // katta oynada ochilsin
    tg.onEvent("fullscreenChanged", () => { if (route.v === "home") render(); });
    tg.onEvent("fullscreenFailed", () => {});
  }
}
const $app = document.getElementById("app"), $nav = document.getElementById("nav");
const params = new URLSearchParams(location.search);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// Savol matni bot tomonidan tayyorlangan; baribir faqat xavfsiz teglarni qoldiramiz
const safe = h => String(h ?? "").replace(/<(?!\/?(b|i|sub|sup|br)\s*\/?>)[^>]*>/gi, "");
const color = p => p >= 75 ? "var(--good)" : p >= 50 ? "var(--mid)" : "var(--bad)";
const medal = i => ["🥇","🥈","🥉"][i] || "";
const haptic = t => { try { t === "sel" ? tg.HapticFeedback.selectionChanged() : tg.HapticFeedback.notificationOccurred(t); } catch (e) {} };
const store = {
  get(k, d) { try { const v = localStorage.getItem("sp:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("sp:" + k, JSON.stringify(v)); } catch (e) {} },
};
const ICO = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const SEC = {
  mock:  {badge: "MX", c: "var(--c-mock)",  desc: "Ibn Sino formatidagi to'liq sinovlar",
          icon: ICO('<path d="M9 3h6M10 3v6.2L4.6 18.4A1.8 1.8 0 0 0 6.2 21h11.6a1.8 1.8 0 0 0 1.6-2.6L14 9.2V3"/><path d="M7.3 15h9.4"/>')},
  sinf5: {badge: "5",  c: "var(--c-sinf5)", desc: "Mavzular bo'yicha testlar, natija darhol",
          icon: ICO('<path d="M5 20C5 11 11 5 20 5c0 9-6 15-15 15Z"/><path d="M5 20l8-8"/>')},
  sinf6: {badge: "6",  c: "var(--c-sinf6)", desc: "Mavzular bo'yicha testlar, natija darhol",
          icon: ICO('<circle cx="12" cy="12" r="1.4" fill="currentColor"/><ellipse cx="12" cy="12" rx="9.5" ry="3.8"/><ellipse cx="12" cy="12" rx="9.5" ry="3.8" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="9.5" ry="3.8" transform="rotate(120 12 12)"/>')},
  mavzu: {badge: "MT", c: "var(--c-mavzu)", desc: "Mavzulashtirilgan testlar",
          icon: ICO('<path d="M4 5h16M4 12h16M4 19h10"/>')},
};
// Tepa blokdagi ilmiy chizmalar: atom, DNK, benzol halqasi, barg, kolba
const HERO_ART = `<svg class="art" viewBox="0 0 400 300" preserveAspectRatio="xMaxYMin slice" fill="none"
  stroke="rgba(242,251,248,.13)" stroke-width="1.3" stroke-linecap="round" aria-hidden="true">
  <g transform="translate(330 70)"><circle r="4" fill="rgba(240,162,59,.55)" stroke="none"/>
    <ellipse rx="40" ry="14"/><ellipse rx="40" ry="14" transform="rotate(60)"/><ellipse rx="40" ry="14" transform="rotate(120)"/>
    <circle cx="40" cy="0" r="2.5" fill="rgba(242,251,248,.35)" stroke="none"/></g>
  <g transform="translate(232 150)">
    <path d="M0 0 C 20 18, 40 18, 60 0 S 100 -18, 120 0 S 160 18, 180 0"/>
    <path d="M0 0 C 20 -18, 40 -18, 60 0 S 100 18, 120 0 S 160 -18, 180 0"/>
    <path d="M15 -11v22M30 -14v28M45 -11v22M75 -11v22M90 -14v28M105 -11v22M135 -11v22M150 -14v28M165 -11v22"/></g>
  <g transform="translate(250 40)"><path d="M0 -20l17.3 10v20L0 20l-17.3-10v-20Z"/><circle r="10"/></g>
  <circle cx="200" cy="40" r="2" fill="rgba(242,251,248,.2)" stroke="none"/><circle cx="385" cy="150" r="3" fill="rgba(242,251,248,.18)" stroke="none"/>
</svg>`;
const secName = k => (DATA.sections.find(s => s[0] === k) || [k, k])[1];

let DATA = null, ME = null, myHash = params.get("u") || "";
let route = {v: "home"}, history_ = [];
let ratingKind = null;

function toast(msg, ms = 2200) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}
function confirmBox(msg) {
  return new Promise(res => {
    if (tg && tg.showConfirm && tg.isVersionAtLeast && tg.isVersionAtLeast("6.2")) tg.showConfirm(msg, ok => res(ok));
    else res(window.confirm(msg));
  });
}

// ---------------- Navigatsiya ----------------
function go(v, extra = {}, push = true) {
  if (push) history_.push(route);
  route = {v, ...extra};
  render();
  window.scrollTo({top: 0});
}
function back() {
  if (route.v === "exam") { leaveExam(); return; }
  route = history_.pop() || {v: "home"};
  render();
}
if (tg && tg.BackButton) tg.BackButton.onClick(back);
$nav.onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  haptic("sel"); history_ = []; route = {v: b.dataset.go}; render(); window.scrollTo({top: 0});
};

function render() {
  clearInterval(window._tick);
  paintChrome();
  const inExam = route.v === "exam";
  $nav.style.display = inExam ? "none" : "";
  [...$nav.children].forEach(b => b.classList.toggle("on", b.dataset.go === route.v ||
    (b.dataset.go === "home" && ["section", "intro"].includes(route.v))));
  if (tg && tg.BackButton) (["home", "rating", "me"].includes(route.v) ? tg.BackButton.hide() : tg.BackButton.show());
  if (tg) { try { inExam ? tg.enableClosingConfirmation() : tg.disableClosingConfirmation(); } catch (e) {} }
  ({home: viewHome, section: viewSection, intro: viewIntro, exam: viewExam, rating: viewRating, me: viewMe})[route.v]();
}

// ---------------- Yordamchilar ----------------
function places(list, idx) {
  let prev = null, place = 0;
  return list.map((r, i) => { if (r[idx] !== prev) { place = i + 1; prev = r[idx]; } return place; });
}
function rankRows(list, idx, fmt, limit = 1e6) {
  const pl = places(list, idx);
  return list.slice(0, limit).map((r, i) => {
    const p = pl[i], mine = ME && r[0] === ME.name;
    return `<div class="row${mine ? " me" : ""}"><span class="rank${p <= 3 ? " m" : ""}">${p <= 3 ? medal(p - 1) : p}</span>
      <span class="name">${esc(r[0])}</span>${fmt(r)}</div>`;
  }).join("");
}
function bars(topics) {
  return `<div class="bars">${topics.map(([t, p]) => `<div class="bar"><span class="lbl">${esc(t)}</span>
    <span class="pct" style="color:${color(p)}">${p}%</span>
    <div class="track"><div class="fill" style="width:${p}%;background:${color(p)}"></div></div></div>`).join("")}</div>`;
}
const fmtTime = s => { s = Math.max(0, Math.floor(s)); const m = Math.floor(s / 60), x = s % 60;
  return m >= 60 ? `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")}:${String(x).padStart(2, "0")}` : `${m}:${String(x).padStart(2, "0")}`; };
const isDone = code => store.get("done:" + code, false);
const hm = ms => { const d = new Date(ms); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };
const MONTHS = ["yanvar","fevral","mart","aprel","may","iyun","iyul","avgust","sentabr","oktabr","noyabr","dekabr"];
const dayTxt = ms => { const d = new Date(ms), n = new Date();
  return d.toDateString() === n.toDateString() ? "bugun" : `${d.getDate()}-${MONTHS[d.getMonth()]}`; };
const winTxt = t => t.opens || t.closes ? `${t.opens ? hm(t.opens) : ""}–${t.closes ? hm(t.closes) : ""} (${dayTxt(t.opens || t.closes)})` : "";
const state = t => { const now = Date.now();   // "soon" | "open" | "over"
  return t.opens && now < t.opens ? "soon" : t.closes && now > t.closes ? "over" : "open"; };
// Testning tugash vaqti: boshlangandan + daqiqalar, lekin oraliq oxiridan oshmaydi
const deadline = (t, start) => Math.min(t.minutes ? start + t.minutes * 60000 : Infinity, t.closes || Infinity);

// ---------------- Imtihon ----------------
let EX = null;  // {t, test, st, i}

async function viewExam() {
  const t = DATA.open.find(x => x.code === route.code);
  if (!t || isDone(t.code) || (state(t) === "soon") || (state(t) === "over" && !store.get("ex:" + t.code, null))) {
    route = {v: "intro", code: route.code}; render(); return; }
  if (!EX || EX.t.code !== t.code) {
    $app.innerHTML = `<div class="empty">Savollar yuklanmoqda…</div>`;
    let test;
    try { test = await (await fetch(t.src + "?v=" + encodeURIComponent(DATA.updated), {cache: "no-cache"})).json(); }
    catch (e) { $app.innerHTML = `<div class="card"><div class="empty">Savollarni yuklab bo'lmadi. Internetni tekshirib, qayta oching.</div></div>`; return; }
    const st = store.get("ex:" + t.code, null) || {start: Date.now(), ans: {}, flag: {}, i: 0};
    store.set("ex:" + t.code, st);
    EX = {t, test, st, base: t.src.replace(/test\.json$/, ""), warned: false};
  }
  drawQ();
  if (EX.t.minutes || EX.t.closes) {
    const tick = () => {
      const left = (deadline(EX.t, EX.st.start) - Date.now()) / 1000;
      const el = document.getElementById("timer");
      if (el) { el.textContent = "⏱ " + fmtTime(left); el.classList.toggle("warn", left <= 300); }
      if (left <= 300 && !EX.warned) { EX.warned = true; haptic("warning"); toast("⚠️ 5 daqiqa qoldi!"); }
      if (left <= 0) { clearInterval(window._tick); finish(true); }
    };
    tick(); window._tick = setInterval(tick, 1000);
  }
}

function save() { store.set("ex:" + EX.t.code, EX.st); }

function drawQ() {
  const {t, test, st} = EX, n = test.questions.length, i = Math.min(st.i, n - 1), q = test.questions[i];
  const answered = Object.keys(st.ans).length;
  const body = q.body.map(b => b.t ? `<div class="qtext">${safe(b.t)}</div>`
    : b.img ? `<img class="qimg" src="${esc(EX.base + b.img)}" alt="Savol rasmi" loading="eager" data-zoom>`
    : b.table ? `<div class="tbl"><table>${b.table.map(r => `<tr>${r.map(c => `<td>${safe(c)}</td>`).join("")}</tr>`).join("")}</table></div>` : "").join("");
  const hasImg = q.body.some(b => b.img);
  $app.innerHTML = `<div class="exam">
    <div class="ehead"><div class="l1">
      <div class="ttl">${esc(t.title)}</div>
      ${t.minutes || t.closes ? `<div class="timer" id="timer">⏱</div>` : ""}
    </div><div class="prog"><i style="width:${100 * answered / n}%"></i></div></div>
    <div class="qnum"><b>Savol ${i + 1} / ${n}</b>
      <button class="flag ${st.flag[i] ? "on" : ""}" id="flag">${st.flag[i] ? "🚩 Belgilangan" : "🚩 Belgilash"}</button></div>
    ${q.topic ? `<div class="topic">${esc(q.topic)}</div>` : ""}
    <div class="qcard">${body}${hasImg ? `<div class="zoomhint">🔍 Kattalashtirish uchun rasmni bosing</div>` : ""}</div>
    <div class="opts">${q.opts.map(o => `<button class="opt ${st.ans[i] === o.l.toLowerCase() ? "sel" : ""}" data-l="${o.l.toLowerCase()}">
      <span class="L">${esc(o.l)}</span><span>${safe(o.h)}${o.img ? `<img src="${esc(EX.base + o.img)}" alt="" data-zoom>` : ""}</span></button>`).join("")}</div>
  </div>
  <div class="ebar"><div class="in">
    <button class="pv" id="pv" ${i === 0 ? "disabled" : ""}>‹ Oldingi</button>
    <button class="grid-btn" id="grid">▦ ${answered}/${n}</button>
    ${i < n - 1 ? `<button class="nx" id="nx">Keyingi ›</button>` : `<button class="nx fin" id="fin">Yakunlash ✓</button>`}
  </div></div>`;

  $app.querySelectorAll(".opt").forEach(b => b.onclick = e => {
    if (e.target.matches("[data-zoom]")) return;
    const l = b.dataset.l;
    if (st.ans[i] === l) delete st.ans[i]; else st.ans[i] = l;
    save(); haptic("sel"); drawQ();
  });
  $app.querySelectorAll("[data-zoom]").forEach(img => img.onclick = e => { e.stopPropagation(); openViewer(img.src); });
  document.getElementById("flag").onclick = () => { st.flag[i] ? delete st.flag[i] : st.flag[i] = 1; save(); haptic("sel"); drawQ(); };
  document.getElementById("pv").onclick = () => move(-1);
  const nx = document.getElementById("nx"); if (nx) nx.onclick = () => move(1);
  const fin = document.getElementById("fin"); if (fin) fin.onclick = () => finish(false);
  document.getElementById("grid").onclick = openGrid;
  // keyingi savol rasmlarini oldindan yuklab qo'yish
  const nq = test.questions[i + 1];
  if (nq) nq.body.filter(b => b.img).forEach(b => { new Image().src = EX.base + b.img; });
  if (EX.t.minutes || EX.t.closes) { const left = (deadline(EX.t, st.start) - Date.now()) / 1000;
    const el = document.getElementById("timer"); if (el) { el.textContent = "⏱ " + fmtTime(left); el.classList.toggle("warn", left <= 300); } }
}

function move(d) {
  const n = EX.test.questions.length;
  EX.st.i = Math.max(0, Math.min(n - 1, EX.st.i + d)); save(); haptic("sel"); drawQ(); window.scrollTo({top: 0});
}

function openGrid() {
  const {st, test} = EX, n = test.questions.length;
  const s = document.createElement("div"); s.className = "sheet";
  s.innerHTML = `<div class="box"><h3>Savollar</h3>
    <div class="legend"><span><i style="background:var(--accent)"></i>Javob berilgan</span>
      <span><i style="border:2px solid var(--line)"></i>Javobsiz</span><span><i style="background:var(--mid);border-radius:50%"></i>Belgilangan</span></div>
    <div class="cells">${Array.from({length: n}, (_, i) =>
      `<button data-i="${i}" class="${st.ans[i] ? "a" : ""} ${st.flag[i] ? "f" : ""} ${i === st.i ? "cur" : ""}">${i + 1}</button>`).join("")}</div>
    <button class="btn fin" id="gfin" style="background:var(--good);color:#fff">Yakunlash ✓</button></div>`;
  s.onclick = e => {
    const b = e.target.closest("[data-i]");
    if (b) { st.i = +b.dataset.i; save(); s.remove(); drawQ(); window.scrollTo({top: 0}); }
    else if (e.target.id === "gfin") { s.remove(); finish(false); }
    else if (e.target === s) s.remove();
  };
  document.body.appendChild(s); haptic("sel");
}

async function finish(timeout) {
  const {t, st, test} = EX, n = test.questions.length;
  const empty = n - Object.keys(st.ans).length;
  if (!timeout) {
    const msg = empty ? `${empty} ta savolga javob berilmagan. Baribir yakunlaysizmi?` : "Barcha savollarga javob berdingiz. Yakunlaysizmi?";
    if (!(await confirmBox(msg))) return;
  }
  const a = Array.from({length: n}, (_, i) => st.ans[i] || "-").join("");
  const payload = JSON.stringify({c: t.code, a, s: st.start});
  store.set("done:" + t.code, true);
  clearInterval(window._tick);
  haptic("success");
  if (tg && tg.sendData && tg.platform !== "unknown" && !(tg.initDataUnsafe && tg.initDataUnsafe.query_id)) {
    try { tg.disableClosingConfirmation(); } catch (e) {}
    tg.sendData(payload);   // ilova yopiladi, bot javob qaytaradi
  } else {
    $app.innerHTML = `<div class="card"><h2 class="sec">${timeout ? "Vaqt tugadi" : "Test yakunlandi"}</h2>
      <p>Ilovani botdagi pastki <b>📝 Testlar</b> tugmasi orqali oching. Hozircha javoblaringizni botga matn qilib yuboring:</p>
      <div class="qcard" style="background:var(--bg2);word-break:break-all;font-family:monospace">${esc(t.code)}*${esc(a)}</div></div>`;
  }
}

function leaveExam() {
  route = {v: "intro", code: route.code}; EX = null; render();
  if (store.get("ex:" + route.code, null) && !isDone(route.code)) toast("Test saqlandi. Vaqt davom etmoqda ⏱");
}

// ---------------- Rasm ko'ruvchi (kattalashtirish) ----------------
function openViewer(src) {
  const v = document.createElement("div"); v.className = "viewer";
  v.innerHTML = `<div class="vbar"><span style="display:flex;gap:6px"><button data-z="-">−</button><button data-z="+">+</button></span>
    <button data-x>✕ Yopish</button></div>
    <div class="stage"><img src="${esc(src)}" alt=""></div>`;
  document.body.appendChild(v);
  const stage = v.querySelector(".stage"), img = v.querySelector("img");
  let scale = 1, baseW = 0;
  const fit = () => { baseW = Math.min(stage.clientWidth, img.naturalWidth * 2 || stage.clientWidth); apply(); };
  const apply = (cx, cy) => {
    const before = img.clientWidth || baseW;
    img.style.width = baseW * scale + "px";
    if (cx != null) { const k = img.clientWidth / before;
      stage.scrollLeft = (stage.scrollLeft + cx) * k - cx; stage.scrollTop = (stage.scrollTop + cy) * k - cy; }
  };
  img.complete ? fit() : (img.onload = fit);
  const zoom = (f, cx = stage.clientWidth / 2, cy = stage.clientHeight / 2) => { scale = Math.min(6, Math.max(1, scale * f)); apply(cx, cy); };
  v.onclick = e => { if (e.target.dataset.z) zoom(e.target.dataset.z === "+" ? 1.5 : 1 / 1.5); if (e.target.hasAttribute("data-x")) v.remove(); };
  let last = 0;
  img.addEventListener("click", e => { const now = Date.now(); if (now - last < 300) { scale > 1.5 ? (scale = 1, apply()) : zoom(2.5, e.offsetX - stage.scrollLeft, e.offsetY - stage.scrollTop); } last = now; });
  let pd = 0;
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  stage.addEventListener("touchstart", e => { if (e.touches.length === 2) pd = dist(e.touches); }, {passive: true});
  stage.addEventListener("touchmove", e => {
    if (e.touches.length === 2 && pd) { e.preventDefault(); const d = dist(e.touches);
      const r = stage.getBoundingClientRect();
      zoom(d / pd, (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left, (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top); pd = d; }
  }, {passive: false});
  stage.addEventListener("touchend", () => { pd = 0; });
}

// ---------------- Reyting ----------------
function viewRating() {
  const kinds = DATA.sections.map(s => s[0]);
  ratingKind = ratingKind || kinds[0];
  const k = DATA.kinds[ratingKind] || {rating: [], tests: []};
  $app.innerHTML = `<div class="titlebar"><h1>🏆 Reyting</h1></div>
    <div class="seg">${DATA.sections.map(([kk, nm]) => `<button data-k="${kk}" class="${kk === ratingKind ? "on" : ""}">${esc(nm)}</button>`).join("")}</div>
    <div class="card">${k.rating.length ? `<h2 class="sec">${k.tests.length} ta test bo'yicha o'rtacha</h2>
      ${rankRows(k.rating, 1, r => `<span class="meta">${r[2]} ta</span><span class="score">${r[1]}%</span>`)}`
      : `<div class="empty">Bu bo'limda hali yakunlangan test yo'q.</div>`}</div>`;
  $app.querySelectorAll(".seg button").forEach(b => b.onclick = () => { ratingKind = b.dataset.k; haptic("sel"); viewRating(); });
}

// ---------------- Mening natijam ----------------
function viewMe() {
  if (!ME) {
    $app.innerHTML = `<div class="titlebar"><h1>👤 Natijam</h1></div><div class="card"><div class="empty">
      ${myHash ? "Hali yakunlangan testlaringiz yo'q.<br>Topshirgan testingiz yakunlangach, natijangiz shu yerda chiqadi."
               : "Shaxsiy natijalar uchun ilovani botdagi <b>📝 Testlar</b> tugmasi orqali oching."}</div></div>`;
    return;
  }
  const pcts = ME.tests.map(t => Math.round(100 * t[2] / t[3]));
  const avg = Math.round(pcts.reduce((a, b) => a + b, 0) / pcts.length);
  const weak = ME.topics.filter(t => t[1] < 60).map(t => t[0]);
  $app.innerHTML = `<div class="titlebar"><h1>👤 ${esc(ME.name)}</h1></div>
    <div class="stats">
      <div><b>${ME.tests.length}</b><span>test</span></div>
      <div><b style="color:${color(avg)}">${avg}%</b><span>o'rtacha</span></div>
      <div><b style="color:${color(Math.max(...pcts))}">${Math.max(...pcts)}%</b><span>eng yaxshi</span></div>
    </div>
    ${weak.length ? `<div class="tip">📌 Ko'proq e'tibor bering: <b>${weak.map(esc).join(", ")}</b></div>` : ""}
    <div class="card"><h2 class="sec">Mavzular bo'yicha</h2>${bars(ME.topics)}</div>
    <div class="card"><h2 class="sec">Testlar tarixi</h2>
      ${[...ME.tests].reverse().map(t => { const p = Math.round(100 * t[2] / t[3]);
        return `<div class="row"><span class="name" style="white-space:normal">${esc(t[0])}
          <div class="meta">${esc(secName(t[1]))} · ${esc(t[4])}${t[5] ? ` · ${t[5]}/${t[6]}-o'rin` : ""}</div></span>
          <span class="score" style="color:${color(p)}">${t[2]}/${t[3]}</span></div>`; }).join("")}
    </div>`;
}

// ---------------- Ishga tushirish ----------------
(async () => {
  try {
    DATA = await (await fetch("data.json?t=" + Date.now(), {cache: "no-store"})).json();
  } catch (e) {
    $app.innerHTML = `<div class="card"><div class="empty">Ma'lumotlarni yuklab bo'lmadi. Keyinroq qayta oching.</div></div>`;
    return;
  }
  DATA.sections = DATA.sections || [["mock", "Mock exam"], ["sinf5", "5-sinf"], ["sinf6", "6-sinf"]];
  DATA.open = DATA.open || []; DATA.kinds = DATA.kinds || {}; DATA.students = DATA.students || {};
  // Yopilgan testlarning eski saqlanmalarini tozalash
  try { Object.keys(localStorage).filter(k => k.startsWith("sp:ex:")).forEach(k => {
    if (!DATA.open.some(t => "sp:ex:" + t.code === k)) localStorage.removeItem(k); }); } catch (e) {}
  ME = myHash && DATA.students[myHash] ? DATA.students[myHash] : null;
  // Tugallanmagan test bo'lsa — davom ettirish
  const running = DATA.open.find(t => store.get("ex:" + t.code, null) && !isDone(t.code));
  if (running) { route = {v: "intro", code: running.code}; history_ = [{v: "home"}]; }
  render();
})();
</script>
